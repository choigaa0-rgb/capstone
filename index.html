<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>냉장고 파먹기 MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F4; --panel:#FFFFFF; --ink:#1D2B33; --mute:#5E6E77; --line:#D6E0E3;
  --urgent:#E5484D; --urgent-bg:#FDE8E8; --soon:#F2B705; --soon-bg:#FFF5CC; --ok:#2E8B57; --ok-bg:#E3F3EA;
  --accent:#1D2B33; --accent-ink:#FFFFFF; --focus:#2F7FD8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A1E; --panel:#1B252B; --ink:#E6EEF1; --mute:#9AAAB2; --line:#2C3A41;
    --urgent:#FF6B6F; --urgent-bg:#3A1F22; --soon:#F6C945; --soon-bg:#3A3219; --ok:#5FC18B; --ok-bg:#1B3327;
    --accent:#E6EEF1; --accent-ink:#121A1E;
  }
}
:root[data-theme="dark"]{
  --bg:#121A1E; --panel:#1B252B; --ink:#E6EEF1; --mute:#9AAAB2; --line:#2C3A41;
  --urgent:#FF6B6F; --urgent-bg:#3A1F22; --soon:#F6C945; --soon-bg:#3A3219; --ok:#5FC18B; --ok-bg:#1B3327;
  --accent:#E6EEF1; --accent-ink:#121A1E;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 48px}
header h1{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:clamp(32px,6vw,48px);line-height:1.1;margin:0 0 6px}
header p{margin:0;color:var(--mute);max-width:60ch}
.grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:24px}
@media(min-width:900px){.grid{grid-template-columns:5fr 6fr}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{font-size:17px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.addrow{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:end}
@media(max-width:480px){.addrow{grid-template-columns:1fr 1fr}.addrow .btn{grid-column:1/-1}}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{width:100%;padding:13px;font-size:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
ul.fridge{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.fridge li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.sticker{font-family:"Do Hyeon",sans-serif;font-size:17px;width:66px;text-align:center;padding:3px 4px;border-radius:6px;transform:rotate(-3deg);flex:none}
.s-urgent{background:var(--urgent);color:#fff}
.s-soon{background:var(--soon);color:#2A2200}
.s-ok{background:var(--ok-bg);color:var(--ok)}
.iname{flex:1;min-width:0}
.iname b{font-weight:600}
.iname small{display:block;color:var(--mute);font-size:12px}
.del{background:none;border:none;color:var(--mute);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px}
.empty{color:var(--mute);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center;margin-top:16px}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cond .full{grid-column:1/-1}
@media(max-width:480px){.cond{grid-template-columns:1fr}}
.skill{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.skill input{position:absolute;opacity:0;width:1px;height:1px}
.skill label{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;font-weight:400;margin:0;height:100%}
.skill label b{display:block;font-size:14px}
.skill label span{font-size:11.5px;color:var(--mute);line-height:1.35;display:block}
.skill input:checked+label{border-color:var(--ink);background:var(--bg);box-shadow:inset 0 0 0 1px var(--ink)}
.skill input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.status{margin-top:12px;font-size:14px;color:var(--mute);min-height:1.2em}
.status.err{color:var(--urgent)}
.results{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.menu{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.menu h3{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:24px;margin:0 0 4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.tag.pri{background:var(--urgent-bg);color:var(--urgent);border-color:transparent;font-weight:600}
.tag.extra{background:var(--soon-bg);color:var(--ink);border-color:transparent}
.why{margin:0 0 8px}
details summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
details ol{margin:6px 0 0;padding-left:20px}
details li{margin-bottom:4px}
.coverage{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px}
.coverage b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:20px}
.check{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.src{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.src li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.src a{color:var(--ink);text-underline-offset:3px;overflow-wrap:anywhere}
.kind{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;flex:none}
.kind.yt{background:var(--urgent-bg);color:var(--urgent)}
.kind.bl{background:var(--ok-bg);color:var(--ok)}
.srch{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.srch a{font-size:13px;font-weight:600;text-decoration:none;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.srch a:hover{border-color:var(--ink)}
.srch a.yt{color:var(--urgent)}
.srch a.nv{color:var(--ok)}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){.menu{animation:in .25s ease-out both}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <p style="margin:0 0 12px;font-size:12.5px;color:var(--mute)">테스트용 시제품이에요. 이름·연락처 같은 개인정보는 입력하지 마세요.</p>
  <header>
    <h1>오늘 냉장고, 뭐부터 먹지?</h1>
    <p>소비기한이 가까운 재료부터 줄 세우고, 내 요리 실력과 취향에 맞는 메뉴를 추천해요. 메뉴마다 유튜브·블로그 레시피로 바로 이동할 수 있어요.</p>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="h-fridge">
      <h2 id="h-fridge">내 냉장고</h2>
      <p class="sub">재료와 소비기한을 넣으면 임박한 순서로 자동 정렬돼요.</p>
      <form id="addForm" class="addrow" autocomplete="off">
        <div><label for="iName">재료</label><input id="iName" placeholder="예: 두부 반 모" required></div>
        <div><label for="iDate">소비기한</label><input id="iDate" type="date" required></div>
        <button class="btn" type="submit">추가</button>
      </form>
      <div class="tools">
        <button class="btn ghost" id="demoBtn" type="button">예시 재료 채우기</button>
        <button class="btn ghost" id="clearBtn" type="button">모두 비우기</button>
      </div>
      <ul class="fridge" id="fridge"></ul>
      <div class="empty" id="empty">아직 재료가 없어요. 위에서 추가하거나 예시 재료를 채워 보세요.</div>
    </section>

    <section class="panel" aria-labelledby="h-me">
      <h2 id="h-me">나에게 맞추기</h2>
      <p class="sub">추천 메뉴에 반영할 조건이에요.</p>
      <div class="cond">
        <fieldset class="full" style="border:none;padding:0;margin:0">
          <legend style="font-size:13px;font-weight:600;margin-bottom:4px">요리 실력</legend>
          <div class="skill">
            <input type="radio" name="skill" id="sk1" value="초급" checked><label for="sk1"><b>초급</b><span>라면·계란후라이 수준, 칼질 최소, 한 번에 끝나는 조리</span></label>
            <input type="radio" name="skill" id="sk2" value="중급"><label for="sk2"><b>중급</b><span>볶음·찌개 등 여러 단계 조리, 기본 칼질 가능</span></label>
            <input type="radio" name="skill" id="sk3" value="상급"><label for="sk3"><b>상급</b><span>튀김·반죽·소스 만들기 등 복잡한 조리 가능</span></label>
          </div>
        </fieldset>
        <div><label for="cTime">조리 가능 시간</label>
          <select id="cTime"><option>15분 이내</option><option selected>30분 이내</option><option>1시간 이내</option></select></div>
        <div><label for="cBuy">추가 재료 구매</label>
          <select id="cBuy"><option value="안 함">사지 않을래요</option><option value="1~2개까지" selected>1~2개까지 괜찮아요</option><option value="상관없음">상관없어요</option></select></div>
        <div class="full"><label for="cLike">좋아하는 음식·먹고 싶은 것</label><input id="cLike" placeholder="예: 매콤한 거, 덮밥류"></div>
        <div class="full"><label for="cAvoid">못 먹거나 피하고 싶은 것 (알레르기 포함)</label><input id="cAvoid" placeholder="예: 새우 알레르기, 오이 싫어함"></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn big" id="goBtn" type="button">맞춤 메뉴 추천받기</button>
        <button class="btn ghost hidden" id="stopBtn" type="button">중지</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="results" id="results"></div>
    </section>
  </div>
</div>

<script>
(function(){
  const KEY = 'fridge-mvp-v1';
  const $ = id => document.getElementById(id);
  let items = [];
  let ctl = null;

  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const iso = d => { const z = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); };
  const plus = n => { const d = today(); d.setDate(d.getDate()+n); return iso(d); };
  const dday = s => { const [y,m,d] = s.split('-').map(Number); return Math.round((new Date(y,m-1,d) - today())/86400000); };
  const label = n => n < 0 ? 'D+'+(-n) : n === 0 ? 'D-DAY' : 'D-'+n;
  const cls = n => n <= 2 ? 's-urgent' : n <= 5 ? 's-soon' : 's-ok';
  const PRIORITY = 2; // D-2 이내 = 우선 소비

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }
  function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)||'[]'); if(Array.isArray(v)) items = v.filter(x=>x&&x.name&&x.date); }catch(e){ items = []; } }
  const sorted = () => items.map(x=>({...x, d: dday(x.date)})).sort((a,b)=>a.d-b.d);

  function render(){
    const ul = $('fridge'); ul.innerHTML = '';
    const list = sorted();
    $('empty').classList.toggle('hidden', list.length>0);
    list.forEach(it=>{
      const li = document.createElement('li');
      const st = document.createElement('span'); st.className='sticker '+cls(it.d); st.textContent=label(it.d);
      const nm = document.createElement('div'); nm.className='iname';
      const b = document.createElement('b'); b.textContent = it.name;
      const sm = document.createElement('small'); sm.textContent = it.d < 0 ? '소비기한 지남 · 상태 확인 필요' : it.d <= PRIORITY ? '우선 소비 · '+it.date : it.date;
      nm.append(b, sm);
      const del = document.createElement('button'); del.className='del'; del.type='button'; del.textContent='×';
      del.setAttribute('aria-label', it.name+' 삭제');
      del.onclick = () => { items = items.filter(x=>x.id!==it.id); save(); render(); };
      li.append(st, nm, del); ul.append(li);
    });
  }

  $('iDate').value = plus(3);
  $('addForm').addEventListener('submit', e=>{
    e.preventDefault();
    const name = $('iName').value.trim(), date = $('iDate').value;
    if(!name || !date) return;
    items.push({id: Date.now()+Math.random(), name, date});
    save(); render();
    $('iName').value=''; $('iName').focus();
  });
  $('demoBtn').onclick = () => {
    items = [
      ['두부 반 모',0],['대파 1/2단',1],['계란 4개',2],['양파 1개',4],['김치 1/4포기',6],
      ['돼지고기 앞다리살 200g',1],['애호박 1/2개',3],['우유 500ml',5],['밥 1공기(냉동)',30]
    ].map(([name,n],i)=>({id:i+1,name,date:plus(n)}));
    save(); render();
  };
  $('clearBtn').onclick = () => { items=[]; save(); render(); $('results').innerHTML=''; };

  function setStatus(t, err){ const s=$('status'); s.textContent=t; s.classList.toggle('err',!!err); }

  function payload(list){
    return {
      today: iso(today()),
      items: list.map(x=>({name:x.name, date:x.date, label:label(x.d), priority:x.d<=PRIORITY, expired:x.d<0})),
      conditions: {
        skill: document.querySelector('input[name=skill]:checked').value,
        time: $('cTime').value, buy: $('cBuy').value,
        like: $('cLike').value.trim(), avoid: $('cAvoid').value.trim()
      }
    };
  }

  function renderResults(data, list){
    const box = $('results'); box.innerHTML='';
    const menus = Array.isArray(data&&data.menus) ? data.menus : [];
    if(!menus.length){ setStatus('추천 결과가 비어 있어요. 조건을 바꿔 다시 시도해 주세요.', true); return; }
    const pri = list.filter(x=>x.d>=0 && x.d<=PRIORITY).map(x=>x.name);
    const usedAll = new Set(menus.flatMap(m=>Array.isArray(m.uses)?m.uses:[]));
    const covered = pri.filter(p=>usedAll.has(p));

    if(pri.length){
      const c = document.createElement('div'); c.className='coverage';
      c.innerHTML = '우선 소비 재료 활용 <b></b>';
      c.querySelector('b').textContent = ` ${covered.length} / ${pri.length}`;
      const miss = pri.filter(p=>!usedAll.has(p));
      if(miss.length){ const s=document.createElement('div'); s.style.color='var(--mute)'; s.style.fontSize='13px'; s.textContent='추천에 쓰이지 않은 재료: '+miss.join(', '); c.append(s); }
      box.append(c);
    }

    menus.forEach(m=>{
      const card = document.createElement('article'); card.className='menu';
      const h = document.createElement('h3'); h.textContent = m.name||'이름 없는 메뉴';
      const meta = document.createElement('div'); meta.className='meta';
      const t1 = document.createElement('span'); t1.className='tag'; t1.textContent = (m.difficulty||'-')+' · '+(m.minutes?m.minutes+'분':'시간 미정');
      meta.append(t1);
      (m.uses||[]).forEach(u=>{ const t=document.createElement('span'); t.className='tag'+(pri.includes(u)?' pri':''); t.textContent=(pri.includes(u)?'우선 ':'')+u; meta.append(t); });
      (m.extra||[]).forEach(u=>{ const t=document.createElement('span'); t.className='tag extra'; t.textContent='+ 구매 '+u; meta.append(t); });
      const why = document.createElement('p'); why.className='why'; why.textContent = m.why||'';
      card.append(h, meta, why);
      const q = encodeURIComponent((m.name||'')+' 레시피');
      const sr = document.createElement('div'); sr.className='srch';
      [['yt','유튜브에서 레시피 보기','https://www.youtube.com/results?search_query='+q],
       ['nv','네이버 블로그 레시피','https://search.naver.com/search.naver?where=blog&query='+q],
       ['','만개의레시피','https://www.10000recipe.com/recipe/list.html?q='+q]].forEach(([c,t,u])=>{
        const a=document.createElement('a'); a.className=c; a.href=u; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent=t; sr.append(a);
      });
      card.append(sr);
      const det = document.createElement('details');
      const sum = document.createElement('summary'); sum.textContent='AI 요약 조리 순서 보기';
      const ol = document.createElement('ol');
      (m.steps||[]).forEach(s=>{ const li=document.createElement('li'); li.textContent=s; ol.append(li); });
      det.append(sum, ol); card.append(det);
      box.append(card);
    });

    const chk = document.createElement('div'); chk.className='check';
    chk.textContent = (data.note ? data.note+' ' : '') + 'AI가 만든 추천이에요. 레시피 링크의 원문과 재료 상태를 확인하고 요리하세요.';
    box.append(chk);
  }

  $('goBtn').onclick = async () => {
    const list = sorted();
    if(!list.length){ setStatus('먼저 냉장고에 재료를 추가해 주세요.', true); $('iName').focus(); return; }
    ctl = new AbortController();
    $('goBtn').disabled = true; $('stopBtn').classList.remove('hidden');
    $('results').innerHTML=''; setStatus('메뉴를 고르는 중이에요. 보통 5~20초 걸려요.');
    try{
      const r = await fetch('/api/recommend', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(payload(list)), signal: ctl.signal });
      const data = await r.json().catch(()=>({error:'응답을 읽지 못했어요. 다시 눌러 주세요.'}));
      if(!r.ok || data.error){ setStatus(data.error || '추천을 만들지 못했어요. 다시 눌러 주세요.', true); return; }
      setStatus('');
      renderResults(data, list);
    }catch(e){
      if(e && e.name === 'AbortError') setStatus('추천을 중지했어요.');
      else setStatus('서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.', true);
    }finally{
      $('goBtn').disabled = false; $('stopBtn').classList.add('hidden');
    }
  };
  $('stopBtn').onclick = () => ctl && ctl.abort();

  load(); render();
})();
</script>
</body>
</html>
